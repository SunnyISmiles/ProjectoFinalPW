<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page do Projecto PW-LEI</title>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Projecto PW-LEI</h1>
        <p>Pokedex</p>
        <input type="search" class='barra-procura' placeholder="Search.." oninput="filterByName(event)">
        <button id="btn-favoritos" onclick="abrirFavoritos()">Favoritos</button>
    </header>
    

    <main>

        <section id="gallery">
            
            
        </section>

        
    </main>

    <div id="overlay" onclick="fecharFavoritos()"></div>

    <div id="drawer-favoritos" class="drawer fechado">
        <div class="drawer-header">
            <h2>Favoritos</h2>
            <button class="btn-fechar" onclick="fecharFavoritos()">✕</button>
        </div>
        <ul id="lista-favoritos"></ul>
    </div>
</body>
</html>
